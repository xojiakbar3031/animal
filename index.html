<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>🐾 Animals</h1>
    <p>Hayvonot dunyosi bilan tanishing</p>
  </header>

  <main class="container">

    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Hayvon nomini qidiring...">

      <select id="typeFilter" class="select-box">
        <option value="all">Barcha turlar</option>
      </select>

      <select id="sortSelect" class="select-box">
        <option value="default">Saralash</option>
        <option value="nameAsc">Nomi: A → Z</option>
        <option value="nameDesc">Nomi: Z → A</option>
      </select>

      <button id="resetBtn" class="reset-btn">Tozalash</button>
    </div>

    <p class="result-count" id="resultCount"></p>

    <div class="cards-grid" id="cardsGrid"></div>

    <p class="no-result" id="noResult">Hech narsa topilmadi 😔</p>

  </main>

  <script src="script.js"></script>
</body>
</html>
